name: Build and Publish ONNX Container

# Trigger the workflow whenever code is pushed to the 'main' branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Check out the code (The Git part)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Download the Model (The "Model Registry" part)
      # We use 'wget' to fetch it from Hugging Face.
      - name: Download RoBERTa ONNX Model
        run: |
          wget https://huggingface.co/onnxmodelzoo/roberta-sequence-classification-9/resolve/main/roberta-sequence-classification-9.onnx
          echo "Model downloaded successfully!"
          ls -lh *.onnx

      # 3. Log in to Docker Hub (The Authentication part)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push the Docker Image
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image with 'latest' and the specific git commit SHA for versioning
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/roberta-onnx:latest
            ${{ secrets.DOCKER_USERNAME }}/roberta-onnx:${{ github.sha }}